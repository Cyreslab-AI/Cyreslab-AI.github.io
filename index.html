<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cyreslab.ai</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="noise-overlay"></div>
    
    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <div class="logo-container">
                    <div class="main-logo">
                        <div class="logo-symbol">
                            <svg viewBox="0 0 100 100" width="100" height="100">
                                <!-- Outer mirror frame -->
                                <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="2" />
                                
                                <!-- Mirror surface with gradient -->
                                <circle cx="50" cy="50" r="40" fill="url(#mirror-gradient)" />
                                
                                <!-- Mirror reflection lines -->
                                <path d="M30,30 L70,70" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
                                <path d="M70,30 L30,70" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
                                
                                <!-- Shield outline -->
                                <path d="M50,20 L75,35 L75,65 L50,80 L25,65 L25,35 Z" fill="none" stroke="currentColor" stroke-width="2" />
                                
                                <!-- Cyber eye -->
                                <circle cx="50" cy="50" r="12" fill="none" stroke="currentColor" stroke-width="2" />
                                <circle cx="50" cy="50" r="5" fill="currentColor" />
                                
                                <!-- Digital circuit lines -->
                                <path d="M50,20 L50,38" stroke="currentColor" stroke-width="1" />
                                <path d="M75,50 L62,50" stroke="currentColor" stroke-width="1" />
                                <path d="M50,80 L50,62" stroke="currentColor" stroke-width="1" />
                                <path d="M25,50 L38,50" stroke="currentColor" stroke-width="1" />
                                
                                <!-- Gradient definition -->
                                <defs>
                                    <radialGradient id="mirror-gradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                                        <stop offset="0%" stop-color="rgba(0, 179, 230, 0.1)" />
                                        <stop offset="100%" stop-color="rgba(10, 14, 23, 0.8)" />
                                    </radialGradient>
                                </defs>
                            </svg>
                        </div>
                        <div class="logo-text">
                            <h1>cyreslab</h1>
                        </div>
                    </div>
                </div>
                
                <div class="deception-teaser">
                    <span class="typewriter">What if your strongest defense isn't a wall, but a mirror?</span>
                </div>
                
                <div class="terminal">
                    <div class="terminal-header">
                        <span class="terminal-button"></span>
                        <span class="terminal-button"></span>
                        <span class="terminal-button"></span>
                    </div>
                    <div class="terminal-body">
                        <p><span class="terminal-prompt">$</span> <span class="terminal-command">init cyreslab.ai</span></p>
                        <p><span class="terminal-output">Initializing secure environment...</span></p>
                        <p><span class="terminal-output">Deploying cognitive defense systems...</span></p>
                        <p><span class="terminal-output">Access restricted. Protocols active.</span></p>
                    </div>
                </div>
                
                <div class="contact-button stealth-contact">
                    <a href="mailto:contact@cyreslab.ai" class="button">
                        <span class="button-text">Establish Connection</span>
                        <span class="button-icon">→</span>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-left">
                    <p>&copy; 2025 cyreslab.ai</p>
                </div>
                <div class="footer-right">
                    <p class="coordinates">42.1337° Ω, 101.0101° Ψ</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
